<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Net - مندوب إلكتروني</title>
    <style>
        /* الألوان الأساسية */
        :root {
            --white: #ffffff;
            --blue: #007BFF;
            --peach: #FF8C69;
            --bg: #f5f6fa;
            --text-dark: #333333;
            --text-light: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* إخفاء الشاشات في البداية */
        #step-welcome { display: block; }
        #step-phone { display: none; }
        #step-otp { display: none; }

        .logo {
            font-size: 40px;
            font-weight: bold;
            color: var(--blue);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--peach);
            font-size: 16px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 10px;
            color: var(--blue);
        }

        p.description {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 25px;
        }

        input[type="tel"], input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            transition: border-color 0.3s;
            direction: ltr;
        }

        input:focus {
            outline: none;
            border-color: var(--blue);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--blue);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover { background-color: #0056b3; }
        button:active { transform: scale(0.98); }

        .btn-peach { background-color: var(--peach); }
        .btn-peach:hover { background-color: #e67e5a; }

        .error-msg {
            color: red;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .link {
            color: var(--blue);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. شاشة الترحيب -->
        <div id="step-welcome">
            <div class="logo">Net</div>
            <div class="subtitle">مندوب إلكتروني</div>
            <h2>أهلاً بك في تطبيقنا</h2>
            <p class="description">للدخول إلى التطبيق، يرجى تأكيد رقم هاتفك.</p>
            <button onclick="showStep('step-phone')">بدء الدخول</button>
        </div>

        <!-- 2. شاشة إدخال رقم الهاتف -->
        <div id="step-phone">
            <h2>رقم الهاتف</h2>
            <p class="description">أدخل رقم هاتفك المكون من 11 رقماً (يبدأ بـ 07).</p>
            <p class="error-msg" id="phone-error">الرجاء إدخال رقم صحيح.</p>
            <input type="tel" id="phone-input" placeholder="07XXXXXXXXX" maxlength="11">
            <button onclick="sendOTP()" id="btn-send-otp">إرسال الكود</button>
        </div>

        <!-- 3. شاشة إدخال كود التحقق OTP -->
        <div id="step-otp">
            <h2>كود التحقق</h2>
            <p class="description">أدخل الكود المكون من 6 أرقام.</p>
            <p class="error-msg" id="otp-error">الكود غير صحيح.</p>
            <input type="number" id="otp-input" placeholder="------" maxlength="6">
            <button onclick="verifyOTP()" class="btn-peach" id="btn-verify-otp">تحقق ودخول</button>
            
            <div id="recaptcha-container"></div>
            <a class="link" id="resend-link" onclick="sendOTP()" style="display:none;">إعادة إرسال الكود</a>
            <span class="link" id="timer-text" style="display:none;">يمكنك الإعادة بعد <span id="timer">60</span> ثانية</span>
            <br>
            <a class="link" onclick="showStep('step-phone')">تغيير رقم الهاتف</a>
        </div>

    </div>

    <!-- سكربت Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrVVzXE_hd-5HTC1CZoVOU7zGNx7TDQQ",
            authDomain: "net-732c9.firebaseapp.com",
            projectId: "net-732c9",
            storageBucket: "net-732c9.firebasestorage.app",
            messagingSenderId: "928563175887",
            appId: "1:928563175887:web:57a9102491dcb8a96572ba"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.languageCode = 'ar';

        let confirmationResult = null;
        let recaptchaVerifier = null;
        let phoneNumberToVerify = "";

        window.showStep = function(stepId) {
            document.getElementById('step-welcome').style.display = 'none';
            document.getElementById('step-phone').style.display = 'none';
            document.getElementById('step-otp').style.display = 'none';
            document.getElementById(stepId).style.display = 'block';
            document.getElementById('phone-error').style.display = 'none';
            document.getElementById('otp-error').style.display = 'none';
        };

        window.setupRecaptcha = function() {
            if (!recaptchaVerifier) {
                recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    'size': 'invisible'
                });
            }
        };

        window.sendOTP = async function() {
            const phoneInput = document.getElementById('phone-input').value.trim();
            const errorMsg = document.getElementById('phone-error');
            const btn = document.getElementById('btn-send-otp');

            if (!phoneInput.startsWith('07') || phoneInput.length !== 11) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "الرجاء إدخال رقم صحيح يبدأ بـ 07 ويتكون من 11 رقماً.";
                return;
            }

            errorMsg.style.display = 'none';
            btn.innerText = "جاري الإرسال...";
            btn.disabled = true;

            phoneNumberToVerify = "+964" + phoneInput.substring(1);

            // 🔥 تخطي جوجل لرقم الاختبار
            if (phoneNumberToVerify === "+9647710669750") {
                showStep('step-otp');
                startTimer();
                btn.innerText = "إرسال الكود";
                btn.disabled = false;
                return; 
            }

            try {
                setupRecaptcha();
                const appVerifier = recaptchaVerifier;
                confirmationResult = await signInWithPhoneNumber(auth, phoneNumberToVerify, appVerifier);
                showStep('step-otp');
                startTimer();
            } catch (error) {
                console.error("خطأ:", error);
                errorMsg.style.display = 'block';
                errorMsg.innerText = "حدث خطأ في إرسال الرسالة. حاول لاحقاً.";
            } finally {
                btn.innerText = "إرسال الكود";
                btn.disabled = false;
            }
        };

        window.verifyOTP = async function() {
            const otpInput = document.getElementById('otp-input').value.trim();
            const errorMsg = document.getElementById('otp-error');
            const btn = document.getElementById('btn-verify-otp');

            if (otpInput.length !== 6) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "الرجاء إدخال كود مكون من 6 أرقام.";
                return;
            }

            errorMsg.style.display = 'none';
            btn.innerText = "جاري التحقق...";
            btn.disabled = true;

            // 🔥 التحقق من رقم الاختبار
            if (phoneNumberToVerify === "+9647710669750") {
                if (otpInput === "123456") {
                    alert("✅ تم التحقق بنجاح!\nأهلاً بك في التطبيق.");
                    // هنا سننتقل للصفحة الرئيسية لاحقاً
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = "الكود غير صحيح (تذكر أن الكود هو 123456).";
                }
                btn.innerText = "تحقق ودخول";
                btn.disabled = false;
                return;
            }

            // التحقق الحقيقي (مستقبلاً)
            try {
                if (!confirmationResult) throw new Error("لم يتم طلب الكود بعد.");
                await confirmationResult.confirm(otpInput);
                alert("✅ تم التحقق بنجاح!\nأهلاً بك في التطبيق.");
            } catch (error) {
                console.error("خطأ:", error);
                errorMsg.style.display = 'block';
                errorMsg.innerText = "الكود غير صحيح أو انتهت صلاحيته.";
                btn.innerText = "تحقق ودخول";
                btn.disabled = false;
            }
        };

        window.startTimer = function() {
            let timeLeft = 60;
            const timerText = document.getElementById('timer-text');
            const timerSpan = document.getElementById('timer');
            const resendLink = document.getElementById('resend-link');
            
            timerText.style.display = 'inline-block';
            resendLink.style.display = 'none';
            timerSpan.innerText = timeLeft;

            const interval = setInterval(() => {
                timeLeft--;
                timerSpan.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerText.style.display = 'none';
                    resendLink.style.display = 'inline-block';
                }
            }, 1000);
        };
    </script>
</body>
</html>
